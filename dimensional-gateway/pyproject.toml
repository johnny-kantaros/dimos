[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimensional-gateway"
version = "0.1.0"
description = "Dimensional robot control plane"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "zeroconf>=0.131.0",
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "openai>=1.30.0",
    "dimos @ file:///${PROJECT_ROOT}/../",
]

[project.scripts]
dimctl = "dimensional_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dimensional_gateway*"]
